name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            container: archlinux:latest
            package_cmd: |
              pacman -Syu --noconfirm
              pacman -S --noconfirm base-devel glfw freetype2

          - distro: debian
            container: debian:testing
            package_cmd: |
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y build-essential pkg-config libglfw3-dev libfreetype-dev

          - distro: ubuntu
            container: ubuntu:24.04
            package_cmd: |
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get upgrade -y
              apt-get install -y build-essential pkg-config libglfw3-dev libfreetype-dev

          - distro: fedora
            container: fedora:latest
            package_cmd: |
              dnf install -y gcc-c++ make glfw-devel freetype-devel
