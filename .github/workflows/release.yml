name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            container: archlinux:latest
            package_cmd: |
              pacman -Syu --noconfirm
              pacman -S --noconfirm base-devel glfw freetype2

          - distro: debian
            container: debian:testing
            package_cmd: |
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y build-essential pkg-config libglfw3-dev libfreetype-dev

          - distro: ubuntu
            container: ubuntu:24.04
            package_cmd: |
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get upgrade -y
              apt-get install -y build-essential pkg-config libglfw3-dev libfreetype-dev

          - distro: fedora
            container: fedora:latest
            package_cmd: |
              dnf install -y gcc-c++ make glfw-devel freetype-devel

    runs-on: ubuntu-latest
    container: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: ${{ matrix.package_cmd }}

      - name: Compile
        run: make -C src

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/reglyph-${GITHUB_REF_NAME}-${{ matrix.distro }}-x86_64.tar.gz \
            -C src reglyph

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reglyph-${{ matrix.distro }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
